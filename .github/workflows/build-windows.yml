name: build-windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # GitHub 机房直连官方源更稳：去掉仓库里给国内用的 rsproxy / npmmirror 配置
      - name: Use official registries
        shell: bash
        run: |
          rm -f src-tauri/.cargo/config.toml
          rm -f .npmrc

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 下载内嵌 MPV 需要的 libmpv-wrapper.dll 与 libmpv-2.dll 到 src-tauri/lib（随安装包打包）
      - name: Download libmpv
        run: pnpm exec tauri-plugin-libmpv-api setup-lib

      - name: List libmpv files
        shell: bash
        run: ls -la src-tauri/lib

      - name: Build installer
        run: pnpm tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Weave-setup
          path: src-tauri/target/release/bundle/nsis/*.exe

      # 推送 v* 标签时，同时发布到 Releases
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
