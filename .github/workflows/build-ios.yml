name: build-ios

# 产物是「未签名」的 .ipa：下载后用爱思助手（或 AltStore / Sideloadly）用你自己的 Apple ID 重新签名并安装。
on:
  workflow_dispatch:
  push:
    tags: ['ios-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Use official registries
        run: |
          rm -f src-tauri/.cargo/config.toml
          rm -f .npmrc

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile
          brew install xcodegen || true

      - name: Generate icons
        run: |
          pnpm tauri icon src-tauri/icons/icon.png
          ls src-tauri/icons

      # 全局构建设置：不签名、关掉脚本沙箱（Tauri 的编译脚本要联网/读源码）、统一 Swift 版本和最低系统
      - name: Build settings
        run: |
          cat > "$RUNNER_TEMP/ci.xcconfig" <<'XC'
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          ENABLE_USER_SCRIPT_SANDBOXING = NO
          SWIFT_VERSION = 5.0
          IPHONEOS_DEPLOYMENT_TARGET = 15.0
          XC
          echo "XCODE_XCCONFIG_FILE=$RUNNER_TEMP/ci.xcconfig" >> "$GITHUB_ENV"

      - name: Init iOS project
        run: pnpm tauri ios init --ci

      - name: Patch iOS project
        run: |
          node scripts/ios-patch.mjs
          cd src-tauri/gen/apple && xcodegen generate
          # 工程文件里直接关掉签名（全局设置对 Xcode 的「需要开发团队」检查不起作用）
          python3 - <<'PY'
          import re
          p = 'weave.xcodeproj/project.pbxproj'
          s = open(p).read()
          s = re.sub(r'\s*(CODE_SIGN_STYLE|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY|"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]"|PROVISIONING_PROFILE_SPECIFIER) = [^;]*;', '', s)
          s = s.replace('buildSettings = {', 'buildSettings = {\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGN_IDENTITY = "";')
          open(p, 'w').write(s)
          print('已关闭签名')
          PY
          cd ../../..
          # Info.plist 必须在 xcodegen 之后改（xcodegen 每次生成都会重写它）
          node scripts/ios-patch.mjs --plist

      # 导出（签名）那一步没证书会失败，但只要编译成功就行；编译失败（xcodebuild 报错）则直接让 CI 变红
      - name: Build
        run: |
          set +e
          pnpm tauri ios build --target aarch64 --export-method debugging 2>&1 | tee build.log
          set -e
          if grep -q "exited with code 65" build.log; then
            echo "===== 编译失败，错误如下 ====="
            grep -nE "error:" build.log | head -60
            echo "===== 日志最后 80 行 ====="
            tail -80 build.log
            exit 1
          fi

      - name: Package unsigned ipa
        run: |
          ARCH=$(find src-tauri/gen/apple -name '*.xcarchive' -maxdepth 4 | head -1)
          echo "archive: $ARCH"
          APP=""
          if [ -n "$ARCH" ]; then APP=$(find "$ARCH/Products/Applications" -maxdepth 1 -name '*.app' | head -1); fi
          if [ -z "$APP" ]; then
            APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -ipath '*/Build/Products/*iphoneos/*.app' -maxdepth 6 -type d -prune 2>/dev/null | head -1)
          fi
          if [ -z "$APP" ]; then find "$HOME/Library/Developer/Xcode/DerivedData" -name '*.app' -maxdepth 6 -type d | head; fi
          echo "app: $APP"
          test -n "$APP"
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          SZ=$(stat -f%z "$APP/$EXE")
          echo "executable: $EXE ($SZ bytes)"
          du -sh "$APP"
          # 没链上 Rust 库 / MPVKit 时可执行文件会非常小
          test "$SZ" -gt 1000000
          rm -rf "$APP/_CodeSignature" "$APP/embedded.mobileprovision"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry Weave-ios-unsigned.ipa Payload && rm -rf Payload)
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: Weave-ios
          path: out/Weave-ios-unsigned.ipa

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/ios-v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/Weave-ios-unsigned.ipa
