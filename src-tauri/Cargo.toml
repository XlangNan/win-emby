[package]
name = "win-emby"
version = "0.1.0"
description = "Win-Emby — LAN Emby desktop player"
edition = "2021"
license = "MIT"

[lib]
name = "win_emby_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
